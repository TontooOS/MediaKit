[package]
name = "mediakit"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "Video framework for TontooOS - native parsing, decode, capture, streaming, metadata, thumbnails and lossless editing, no external binaries"
authors = ["arlomu"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "mediakit"
path = "src/lib.rs"

[[example]]
name = "playback"
path = "examples/playback.rs"

[[example]]
name = "metadata_thumb"
path = "examples/metadata_thumb.rs"

[[example]]
name = "capture_list"
path = "examples/capture_list.rs"

[[example]]
name = "streaming_hls"
path = "examples/streaming_hls.rs"

[[example]]
name = "mov_prores"
path = "examples/mov_prores.rs"

[dependencies]
foundation = { path = "../Foundation" }
networkkit = { path = "../NetworkKit" }
audiokit = { path = "../AudioKit" }
coreicon = { package = "coreicon", path = "../CoreIcon" }
coretext = { package = "coretext", path = "../CoreText" }
